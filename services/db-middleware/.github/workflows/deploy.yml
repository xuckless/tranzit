name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deploy@tranzit-example-project.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tranzit-db-middleware \
            --source . \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 1 \
            --timeout 60 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --set-env-vars SUPABASE_DIRECT_CONNECTION_STRING="${{ secrets.SUPABASE_CONNECTION_STRING }}"
