# Runs tranzit-rt-service in Docker, joins it to the tailnet, and exposes it publicly
# over HTTPS via Tailscale Funnel at https://tranzit-rt-service.tailnet-example.ts.net
#
# The tailscale sidecar owns the network namespace; the app shares it
# (network_mode: service:tailscale). Funnel (TS_SERVE_CONFIG) publishes :8765 to the
# internet — OTP polls /gtfs-rt/trip-updates over the public Funnel URL.
#
# Auth: set TS_AUTHKEY in .env (a reusable key from the Tailscale admin console).

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tranzit-rt-service-ts
    hostname: tranzit-rt-service
    environment:
      - TS_HOSTNAME=tranzit-rt-service
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tranzit-rt-service
    depends_on:
      - tailscale
    network_mode: service:tailscale
    environment:
      - PORT=8765
      - SUPABASE_DIRECT_CONNECTION_STRING=${SUPABASE_DIRECT_CONNECTION_STRING:-}
      - APP_TOKEN=${APP_TOKEN:-}
      # Optional feed URL overrides (empty = Calgary Open Data defaults in config.go).
      - RT_VEHICLES_URL=${RT_VEHICLES_URL:-}
      - RT_TRIPS_URL=${RT_TRIPS_URL:-}
      - RT_ALERTS_URL=${RT_ALERTS_URL:-}
      - GTFS_STATIC_URL=${GTFS_STATIC_URL:-}
      - STOPS_URL=${STOPS_URL:-}
      - ROUTES_URL=${ROUTES_URL:-}
      - TRAIN_STATIONS_URL=${TRAIN_STATIONS_URL:-}
    restart: unless-stopped

volumes:
  tailscale-state:
