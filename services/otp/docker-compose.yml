# Runs the Calgary OTP routing engine in Docker, joins it to the tailnet, and exposes
# it publicly over HTTPS via Tailscale Funnel at https://tranzit-otp.tailnet-example.ts.net
#
# The tailscale sidecar owns the network namespace; the otp container shares it
# (network_mode: service:tailscale). Funnel (TS_SERVE_CONFIG) publishes :8080 to the
# internet. OTP fetches the rt-service GTFS-RT feed over its public Funnel URL.
#
# Auth: set TS_AUTHKEY in .env (a reusable key from the Tailscale admin console).

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tranzit-otp-ts
    hostname: tranzit-otp
    environment:
      - TS_HOSTNAME=tranzit-otp
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  otp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OTP_VERSION: "2.6.0"
    container_name: tranzit-otp
    depends_on:
      - tailscale
    network_mode: service:tailscale
    restart: unless-stopped

volumes:
  tailscale-state:
