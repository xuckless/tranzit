# Runs tranzit-route-service in Docker, joins it to the tailnet, and exposes it
# publicly over HTTPS via Tailscale Funnel at https://tranzit-route-service.tailnet-example.ts.net
#
# The tailscale sidecar owns the network namespace; the app shares it
# (network_mode: service:tailscale). Funnel (TS_SERVE_CONFIG) publishes :8080 to the
# internet. The app reaches OTP and the middleware over their public Funnel URLs.
#
# Auth: set TS_AUTHKEY in .env (a reusable key from the Tailscale admin console).

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tranzit-route-service-ts
    hostname: tranzit-route-service
    environment:
      - TS_HOSTNAME=tranzit-route-service
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tranzit-route-service
    depends_on:
      - tailscale
    network_mode: service:tailscale
    environment:
      - PORT=8080
      - GMAPS_API_KEY=${GMAPS_API_KEY:-}
      - OTP_BASE_URL=https://tranzit-otp.tailnet-example.ts.net
      - MIDDLEWARE_BASE_URL=https://tranzit-db-middleware.tailnet-example.ts.net
      # Auth (see AUTH.md): JWT for end users on the Funnel port; mTLS server for
      # siblings on MTLS_LISTEN_ADDR; mTLS client when calling middleware.
      - SUPABASE_URL=${SUPABASE_URL:-https://vxpjxjokuzyqigrlvjzb.supabase.co}
      - AUTH_ENFORCE=${AUTH_ENFORCE:-false}
      - MTLS_LISTEN_ADDR=${MTLS_LISTEN_ADDR:-:8443}
      - MTLS_CA_CERT=/certs/ca.crt
      - MTLS_CERT=/certs/tranzit-route-service.crt
      - MTLS_KEY=/certs/tranzit-route-service.key
      - MTLS_ALLOWED_CLIENTS=${MTLS_ALLOWED_CLIENTS:-tranzit-route-save}
      # Empty → calls to middleware use the Funnel URL (safe rollout); set the
      # tailnet IP:port to switch to mTLS.
      - MIDDLEWARE_MTLS_ADDR=${MIDDLEWARE_MTLS_ADDR:-}
      - MIDDLEWARE_MTLS_SERVERNAME=${MIDDLEWARE_MTLS_SERVERNAME:-tranzit-db-middleware}
    volumes:
      # mTLS material: ca.crt + this service's leaf (git-ignored; gen with middleware's scripts/gen-mtls-certs.sh).
      - ./certs:/certs:ro
    restart: unless-stopped

volumes:
  tailscale-state:
