# Runs tranzit-route-service in Docker and joins it to the tailnet as a dedicated
# node "tranzit-route-service" (MagicDNS: tranzit-route-service.tailnet-example.ts.net).
#
# Pattern mirrors tranzit-otp: the tailscale sidecar owns the network namespace and
# the app container shares it (network_mode: service:tailscale). Because the app is
# now directly on the tailnet, it reaches OTP and the middleware over MagicDNS — the
# old Cloud Run userspace-Tailscale proxy (Dockerfile.cloudrun / start-cloudrun.sh /
# OTP_HTTP_PROXY) is no longer used; we build the plain Dockerfile.
#
# Funnel (TS_SERVE_CONFIG) exposes :8080 publicly over HTTPS for the mobile frontend.
# accept-dns=true so it can resolve sibling tailnet nodes (OTP, middleware).
#
# Auth: set TS_AUTHKEY in .env (a reusable key from the Tailscale admin console).

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tranzit-route-service-ts
    hostname: tranzit-route-service
    environment:
      - TS_HOSTNAME=tranzit-route-service
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      tranzit-net:
        aliases:
          - tranzit-route-service.tailnet-example.ts.net
    ports:
      # Published on fedora's tailnet interface so the mobile app (on the tailnet)
      # reaches it over plain HTTP — cert-free alternative to Funnel.
      - "100.74.12.78:18081:8080"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tranzit-route-service
    depends_on:
      - tailscale
    network_mode: service:tailscale
    environment:
      - PORT=8080
      - GMAPS_API_KEY=${GMAPS_API_KEY:-}
      - OTP_BASE_URL=https://tranzit-otp.tailnet-example.ts.net
      - MIDDLEWARE_BASE_URL=https://tranzit-db-middleware.tailnet-example.ts.net
    restart: unless-stopped

volumes:
  tailscale-state:

# Shared bridge so co-located services reach each other directly by their
# MagicDNS name (registered as a network alias) — independent of the tailnet.
networks:
  tranzit-net:
    external: true
