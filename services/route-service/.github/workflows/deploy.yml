name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/000000000000/locations/global/workloadIdentityPools/github-pool/providers/github-provider-route
          service_account: github-deployer@tranzit-example-project.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repo exists
        run: |
          gcloud artifacts repositories create tranzit \
            --repository-format=docker \
            --location=us-central1 \
            --project=tranzit-example-project 2>/dev/null || true

      - name: Build image via Cloud Build
        run: |
          IMAGE="us-central1-docker.pkg.dev/tranzit-example-project/tranzit/tranzit-route-service:latest"
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_IMAGE="${IMAGE}" \
            --project=tranzit-example-project

      - name: Deploy to Cloud Run
        run: |
          IMAGE="us-central1-docker.pkg.dev/tranzit-example-project/tranzit/tranzit-route-service:latest"
          gcloud run deploy tranzit-route-service \
            --image "${IMAGE}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --no-cpu-throttling \
            --project=tranzit-example-project \
            --set-env-vars "GMAPS_API_KEY=${{ secrets.GMAPS_API_KEY }},TS_AUTHKEY=${{ secrets.TS_AUTHKEY }},OTP_BASE_URL=http://tranzit-otp.tailnet-example.ts.net:8080,OTP_HTTP_PROXY=http://localhost:1055,TS_HOSTNAME=tranzit-route-service"
