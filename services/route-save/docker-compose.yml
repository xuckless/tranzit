# Runs tranzit-route-save in Docker and joins it to the tailnet as a dedicated node
# "tranzit-route-save" (MagicDNS: tranzit-route-save.tailnet-example.ts.net).
#
# Pattern mirrors tranzit-otp: the tailscale sidecar owns the network namespace and
# the app container shares it (network_mode: service:tailscale). The app reaches the
# middleware and route-service over MagicDNS (accept-dns=true).
#
# Funnel (TS_SERVE_CONFIG) exposes :8090 publicly over HTTPS for the mobile frontend
# (the trip WebSocket rides the same HTTPS endpoint as wss://).
#
# Auth: set TS_AUTHKEY in .env (a reusable key from the Tailscale admin console).

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tranzit-route-save-ts
    hostname: tranzit-route-save
    environment:
      - TS_HOSTNAME=tranzit-route-save
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_USERSPACE=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      tranzit-net:
        aliases:
          - tranzit-route-save.tailnet-example.ts.net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tranzit-route-save
    depends_on:
      - tailscale
    network_mode: service:tailscale
    environment:
      - PORT=8090
      - LOG_STATE=1
      - MIDDLEWARE_URL=http://tranzit-db-middleware.tailnet-example.ts.net:8080
      - ROUTE_SERVICE_URL=http://tranzit-route-service.tailnet-example.ts.net:8080
    restart: unless-stopped

volumes:
  tailscale-state:

# Shared bridge so co-located services reach each other directly by their
# MagicDNS name (registered as a network alias) — independent of the tailnet.
networks:
  tranzit-net:
    external: true
