name: Deploy to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test -race ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/000000000000/locations/global/workloadIdentityPools/github-pool/providers/github-provider-route-save
          service_account: github-route-save@tranzit-example-project.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          gcloud run deploy tranzit-route-save \
            --source . \
            --project tranzit-example-project \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --port 8090 \
            --timeout 3600 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "LOG_STATE=1" \
            --quiet
