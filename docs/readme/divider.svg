<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 16" width="1280" height="16" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B352" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00B352"/>
      <stop offset="0.7" stop-color="#FFDE00"/>
      <stop offset="1" stop-color="#FFDE00" stop-opacity="0"/>
    </linearGradient>
    <style>
      .bus { animation: run 5s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes run { from { transform: translateX(-120px); } to { transform: translateX(1400px); } }
    </style>
  </defs>
  <rect x="0" y="7" width="1280" height="2" rx="1" fill="url(#g)" opacity="0.65"/>
  <g class="bus">
    <rect x="0" y="4" width="14" height="8" rx="2.5" fill="#6DD49A"/>
    <rect x="2.5" y="5.5" width="4" height="3" rx="1" fill="#0F1410" opacity="0.65"/>
  </g>
</svg>
